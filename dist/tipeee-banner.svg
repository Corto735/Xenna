<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#1a1a1a"/>

  <!-- ═══════════════════════════════════════
       XENNA — guerrière, épée levée
  ══════════════════════════════════════════ -->
  <g fill="#3a3a3a">
    <!-- chevelure longue derrière -->
    <path d="M 178,96 C 170,78 172,52 184,44 C 192,38 208,38 216,46 C 224,54 222,76 214,92 C 208,76 200,70 192,72 C 184,74 180,86 178,96 Z"/>
    <!-- tête -->
    <circle cx="196" cy="108" r="22"/>
    <!-- cou -->
    <rect x="190" y="128" width="12" height="14" rx="3"/>
    <!-- torse armure -->
    <path d="M 168,142 C 158,150 156,172 158,198 L 160,214 L 232,214 L 234,198 C 236,172 234,150 224,142 Z"/>
    <!-- bras gauche le long du corps -->
    <path d="M 169,152 L 146,194 C 142,204 143,214 150,216 C 157,217 162,208 165,198 L 180,160"/>
    <!-- bras droit levé tenant épée -->
    <path d="M 223,152 L 256,94 C 260,84 258,74 252,72 C 246,70 240,78 237,88 L 214,152"/>
    <!-- épée — lame -->
    <path d="M 252,72 L 278,32 C 280,26 278,20 273,21 C 269,22 267,28 266,34 L 242,76 Z"/>
    <!-- épée — garde -->
    <path d="M 238,86 L 268,68 C 272,66 274,62 272,58 C 270,54 266,55 262,58 L 234,76 Z"/>
    <!-- jambes -->
    <path d="M 170,214 L 162,298 L 158,350 L 178,350 L 182,284 L 190,350 L 208,350 L 216,284 L 220,350 L 240,350 L 236,298 L 228,214 Z"/>
  </g>

  <!-- ═══════════════════════════════════════
       GAABRIELLE — plus petite, bâton
  ══════════════════════════════════════════ -->
  <g fill="#525252">
    <!-- chevelure courte -->
    <path d="M 424,138 C 418,122 420,104 430,98 C 437,93 451,93 457,100 C 463,108 461,126 454,138 C 449,122 441,118 436,120 C 429,122 426,130 424,138 Z"/>
    <!-- tête (plus petite) -->
    <circle cx="438" cy="150" r="18"/>
    <!-- cou -->
    <rect x="432" y="167" width="12" height="12" rx="3"/>
    <!-- torse (svelte) -->
    <path d="M 418,179 C 411,185 410,204 412,224 L 414,236 L 464,236 L 466,224 C 468,204 467,185 460,179 Z"/>
    <!-- bras gauche haut sur bâton -->
    <path d="M 420,186 L 402,148 C 398,138 400,130 406,128 C 412,126 417,134 420,144 L 430,186"/>
    <!-- bras droit bas sur bâton -->
    <path d="M 458,190 L 472,228 C 476,238 473,246 467,247 C 461,248 456,238 454,228 L 444,194"/>
    <!-- bâton diagonal -->
    <path d="M 398,126 C 394,122 392,118 395,114 C 398,110 402,112 406,116 L 478,248 C 482,252 482,258 478,260 C 474,262 470,258 468,254 Z"/>
    <!-- jambes en légère foulée -->
    <path d="M 420,236 L 413,302 L 409,350 L 428,350 L 432,288 L 438,350 L 454,350 L 460,288 L 464,350 L 483,350 L 479,302 L 468,236 Z"/>
  </g>

  <!-- ═══════════════════════════════════════
       HERCUULE — massif, bras écartés
  ══════════════════════════════════════════ -->
  <g fill="#424242">
    <!-- chevelure courte bouclée -->
    <path d="M 694,80 C 688,62 692,42 704,36 C 712,30 726,30 734,36 C 746,42 750,62 744,80 C 738,66 730,60 718,60 C 706,60 698,66 694,80 Z"/>
    <!-- tête (large) -->
    <circle cx="718" cy="94" r="28"/>
    <!-- barbe -->
    <path d="M 694,108 C 688,124 690,144 698,154 C 706,162 712,165 718,165 C 724,165 730,162 738,154 C 746,144 748,124 742,108 Z"/>
    <!-- cou épais -->
    <rect x="710" y="120" width="16" height="16" rx="3"/>
    <!-- torse massif (très large) -->
    <path d="M 648,136 C 634,144 628,170 630,200 L 632,218 L 804,218 L 806,200 C 808,170 802,144 788,136 Z"/>
    <!-- bras gauche — masse levée -->
    <path d="M 650,148 L 596,188 C 586,196 582,208 588,218 C 594,226 606,224 614,216 L 662,176"/>
    <!-- massue dans main gauche -->
    <path d="M 584,216 C 576,208 562,190 556,170 C 550,150 552,136 560,132 C 568,128 578,136 584,154 C 590,172 590,196 584,216 Z"/>
    <!-- bras droit levé — poing -->
    <path d="M 786,148 L 826,110 C 834,100 836,88 830,82 C 824,76 814,79 807,88 L 770,132"/>
    <!-- poing -->
    <path d="M 830,80 C 836,74 842,72 846,76 C 850,80 848,88 842,94 C 838,98 826,100 820,96 C 814,92 816,84 826,80 Z"/>
    <!-- jambes puissantes -->
    <path d="M 648,218 L 636,308 L 630,358 L 658,358 L 664,288 L 686,358 L 720,358 L 720,282 L 750,358 L 784,358 L 790,288 L 796,358 L 824,358 L 818,308 L 804,218 Z"/>
  </g>

  <!-- ═══════════════════════════════════════
       POSÉIDON — dieu de la mer, trident >_
  ══════════════════════════════════════════ -->
  <g fill="#606060">
    <!-- couronne vagues -->
    <path d="M 956,80 C 952,62 956,42 968,36 C 972,34 978,33 984,34 L 980,50 L 986,38 C 990,34 996,33 1000,36 C 1006,40 1008,56 1005,72 L 999,60 L 996,74 L 990,58 L 985,74 L 979,58 L 972,72 L 968,58 Z"/>
    <!-- tête -->
    <circle cx="980" cy="96" r="24"/>
    <!-- barbe divine longue -->
    <path d="M 958,110 C 950,126 950,148 958,160 C 964,170 972,174 980,174 C 988,174 996,170 1002,160 C 1010,148 1010,126 1002,110 Z"/>
    <!-- cou -->
    <rect x="974" y="118" width="12" height="14" rx="3"/>
    <!-- robe fluide (s'élargit vers le bas) -->
    <path d="M 944,132 C 930,140 924,166 926,198 L 928,214 L 1032,214 L 1034,198 C 1036,166 1030,140 1016,132 Z"/>
    <!-- robe bas évasée -->
    <path d="M 928,214 C 918,248 912,286 910,326 C 908,348 912,368 918,372 L 1042,372 C 1048,368 1052,348 1050,326 C 1048,286 1042,248 1032,214 Z"/>
    <!-- vagues en bas de robe -->
    <path d="M 910,354 C 922,342 934,354 946,342 C 958,330 970,342 982,330 C 994,318 1006,330 1018,342 C 1030,354 1042,342 1050,354 L 1050,372 L 910,372 Z" fill="#1a1a1a" opacity="0.4"/>
    <!-- bras gauche tendu -->
    <path d="M 946,142 L 912,170 C 904,178 902,190 908,198 C 914,206 926,204 934,196 L 952,168"/>
    <!-- bras droit — trident levé -->
    <path d="M 1014,142 L 1048,102 C 1054,92 1054,80 1047,77 C 1040,74 1033,82 1029,92 L 1000,142"/>
    <!-- trident — manche -->
    <path d="M 1047,77 L 1068,30 C 1070,24 1072,18 1068,15 C 1064,12 1060,16 1058,22 L 1037,75 Z"/>
    <!-- trident — 3 dents -->
    <path d="M 1058,28 L 1054,8 C 1053,4 1056,2 1059,4 C 1062,6 1062,10 1061,14 Z"/>
    <path d="M 1066,24 L 1066,4 C 1066,0 1070,0 1072,4 C 1074,8 1072,14 1070,18 Z"/>
    <path d="M 1050,30 L 1043,12 C 1041,8 1044,5 1047,7 C 1050,9 1051,14 1052,18 Z"/>
    <!-- trident — barre horizontale -->
    <path d="M 1043,28 C 1041,24 1043,20 1047,20 L 1074,16 C 1078,16 1080,20 1078,24 C 1076,28 1072,28 1069,28 Z"/>
    <!-- easter egg subtil : >_ sur le manche -->
    <text x="1054" y="52" font-family="monospace" font-size="7" fill="#888" transform="rotate(-65,1054,52)">&gt;_</text>
  </g>

  <!-- watermark -->
  <text
    x="600" y="392"
    font-family="monospace" font-size="11"
    fill="#aaaaaa"
    text-anchor="middle"
    letter-spacing="0.12em">claude-sonnet-4-6 — dans le rôle de Poséidon</text>

</svg>
